openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Noble Luxe product catalog
  - name: orders
    description: Customer order submission
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List Noble Luxe products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags: [catalog]
      summary: List featured Noble Luxe products
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Submit a manual-transfer order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderConfirmation"
        "400":
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, category, price, imageUrl, description, sizes, colors, featured]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        price: { type: number }
        imageUrl: { type: string }
        description: { type: string }
        sizes:
          type: array
          items: { type: string }
        colors:
          type: array
          items: { type: string }
        featured: { type: boolean }
    OrderItemInput:
      type: object
      required: [productId, productName, size, quantity, price]
      properties:
        productId: { type: string }
        productName: { type: string }
        size: { type: string }
        quantity: { type: number, minimum: 1 }
        price: { type: number, minimum: 0 }
    OrderInput:
      type: object
      required: [customerName, phone, email, address, items, total, paymentMethod, paymentScreenshot]
      properties:
        customerName: { type: string, minLength: 2 }
        phone: { type: string, minLength: 7 }
        email: { type: string, minLength: 5 }
        address: { type: string, minLength: 8 }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
        total: { type: number, minimum: 0 }
        paymentMethod:
          type: string
          enum: [OPay, PalmPay]
        paymentScreenshot:
          type: string
          description: Uploaded payment screenshot as a data URL for server-side processing
    OrderConfirmation:
      type: object
      required: [orderId, receivedAt, total]
      properties:
        orderId: { type: string }
        receivedAt: { type: string, format: date-time }
        total: { type: number }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

